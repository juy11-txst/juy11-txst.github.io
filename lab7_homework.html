<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Boise Housing Query Portal & Project Hub</title>

  <link rel="stylesheet" href="https://arcgis.com" />
  <script src="https://arcgis.com"></script>

  <style>
    html, body, #viewDiv {
      padding: 0;
      margin: 0;
      height: 100%;
      width: 100%;
    }

    /* Global dashboard class matching your dimgray theme layout */
    .dashboard-panel {
      background-color: dimgray;
      color: white;
      padding: 15px;
      width: 320px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
      border-radius: 4px;
      font-family: "Avenir Next", "Helvetica Neue", Helvetica, Arial, sans-serif;
    }

    .dashboard-panel h1, .dashboard-panel h2 {
      font-size: 16px;
      margin: 0 0 10px 0;
      font-weight: 600;
      text-align: center;
    }

    .dashboard-panel p {
      font-size: 13px;
      color: #dfdfdf;
      margin: 0 0 12px 0;
      text-align: center;
    }

    .query-select, .query-btn, .task-select-dropdown {
      width: 100%;
      margin-bottom: 8px;
      padding: 6px;
      font-size: 14px;
      border-radius: 2px;
      border: 1px solid #ccc;
      box-sizing: border-box;
    }

    .task-select-dropdown {
      cursor: pointer;
      color: #323232;
      background: #fff;
      height: 34px;
    }

    .query-btn {
      background-color: #007ac2;
      color: white;
      font-weight: bold;
      cursor: pointer;
      border: none;
      transition: background-color 0.2s;
    }

    .query-btn:hover {
      background-color: #005e95;
    }

    #printResults {
      font-size: 13px;
      font-weight: bold;
      margin-top: 5px;
      display: block;
      text-align: center;
    }

    label {
      font-size: 13px;
      display: block;
      margin-bottom: 4px;
    }
  </style>

  <script>
    require([
      "esri/map",
      "esri/layers/ArcGISTiledMapServiceLayer",
      "esri/layers/FeatureLayer",
      "esri/layers/GraphicsLayer",
      "esri/tasks/query",
      "dojo/dom",
      "dojo/on",
      "dojo/domReady!"
    ], function(Map, ArcGISTiledMapServiceLayer, FeatureLayer, GraphicsLayer, Query, dom, on) {


      var transportationLayer = new ArcGISTiledMapServiceLayer("https://arcgisonline.com");


      var housingRenderer = {
        type: "simple",
        symbol: {
          type: "simple-marker",
          size: 6,
          color: "orange",
          style: "circle",
          outline: {
            width: 1,
            color: "white"
          }
        }
      };


        mode: FeatureLayer.MODE_ONDEMAND,
        outFields: ["*"],
        infoTemplate: {
          title: "County Info: ${COUNTY}",
          content: "<b>Population (2017):</b> ${POPULATION}<br><b>Square Miles:</b> ${SQMI}"
        }
      });
      boiseHousingLayer.setRenderer(housingRenderer);


      var highlightLayer = new GraphicsLayer();


      var map = new Map("viewDiv", {
        basemap: "dark-gray-vector",
        center: [-116.2023, 43.6150],
        zoom: 7
      });

      map.addLayer(transportationLayer);
      map.addLayer(boiseHousingLayer);
      map.addLayer(highlightLayer);


      map.on("load", function() {

        var viewContainer = dom.byId("viewDiv");
        viewContainer.appendChild(dom.byId("navDiv"));
        viewContainer.appendChild(dom.byId("optionsDiv"));


        on(dom.byId("doQueryBtn"), "click", executeHousingQuery);
        on(dom.byId("taskDropdown"), "change", handleNavigationChange);
      });

      function executeHousingQuery() {

        highlightLayer.clear();

        var selectAttribute = dom.byId("attSelect");
        var selectExpression = dom.byId("signSelect");
        var selectValue = dom.byId("valSelect");

        var whereClause = selectAttribute.value + " " + selectExpression.value + " " + selectValue.value;


        var queryTaskParams = new Query();
        queryTaskParams.where = whereClause;
        queryTaskParams.returnGeometry = true;
        queryTaskParams.outFields = ["*"];

        boiseHousingLayer.queryFeatures(queryTaskParams)
          .then(handleQueryResults)
          .catch(function(error) {
            console.error("Query Execution Exception Root Cause Pipeline Trace: ", error);
          });
      }

      function handleQueryResults(response) {
        var featuresFound = response.features;

        if (!featuresFound || featuresFound.length === 0) {
          dom.byId("printResults").innerHTML = "0 records found matching settings.";
          return;
        }

        var uniqueHighlightStyle = {
          type: "simple-marker",
          size: 12,
          color: "cyan",
          outline: { width: 2, color: "white" }
        };

        featuresFound.forEach(function(feature) {
          feature.setSymbol(uniqueHighlightStyle);
          highlightLayer.add(feature);
        });

        if(featuresFound[0].geometry) {
          map.centerAndZoom(featuresFound[0].geometry, 9);
        }

        dom.byId("printResults").innerHTML = featuresFound.length + " matching record(s) isolated!";
      }


      function handleNavigationChange() {
        var selectedUrl = this.value;
        if (selectedUrl) {
          window.open(selectedUrl, '_blank');
          this.value = "";
        }
      }
    });
  </script>
</head>
<body>

  <div id="viewDiv" style="position:relative;"></div>

  <div class="esri-widget dashboard-panel" id="navDiv" style="position: absolute; top: 20px; right: 20px; z-index: 50;">
    <h1>Lab 7 Tasks</h1>
    <p>Select an entry below to open the specific map task.</p>
    <select id="taskDropdown" class="task-select-dropdown">
      <option value="" selected disabled>-- Select a Map Task --</option>
      <option value="simple_mapping.html">Task 1</option>
      <option value="tile_layer.html">Task 2</option>
      <option value="dynamic_layers.html">Task 3</option>
      <option value="on_event.html">Task 4</option>
      <option value="basemap_gallery.html">Task 5</option>
      <option value="query_task.html">Task 6</option>
    </select>
  </div>

  <div class="esri-widget dashboard-panel" id="optionsDiv" style="position: absolute; bottom: 20px; right: 20px; z-index: 50;">
    <h2>Boise Housing Filters</h2>
    <p>Build custom queries against target spatial data layers.</p>

    <label for="attSelect">Attribute Field</label>
    <select id="attSelect" class="query-select">
      <option value="POPULATION">Population</option>
      <option value="SQMI">Square Miles</option>
    </select>

    <label for="signSelect">Operator</label>
    <select id="signSelect" class="query-select">
      <option value=">">&gt; (Greater Than)</option>
      <option value="<">&lt; (Less Than)</option>
      <option value="=">= (Equals)</option>
    </select>

    <label for="valSelect">Value Threshold</label>
    <select id="valSelect" class="query-select">
      <option value="100000">100,000</option>
      <option value="500000">500,000</option>
      <option value="25">25</option>
      <option value="100">100</option>
    </select>

    <button id="doQueryBtn" class="query-btn">Execute Query Task</button>
    <span id="printResults">Awaiting query configuration...</span>
  </div>

</body>
