<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Boise Housing Query Portal & Project Hub</title>

  <link rel="stylesheet" href="https://arcgis.com" />
  <script src="https://arcgis.com"></script>

  <style>
    html, body, #viewDiv {
      padding: 0;
      margin: 0;
      height: 100%;
      width: 100%;
    }

    /* Global dashboard class matching your dimgray theme layout */
    .dashboard-panel {
      background-color: dimgray;
      color: white;
      padding: 15px;
      width: 320px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
      border-radius: 4px;
      font-family: "Avenir Next", "Helvetica Neue", Helvetica, Arial, sans-serif;
    }

    .dashboard-panel h1, .dashboard-panel h2 {
      font-size: 16px;
      margin: 0 0 10px 0;
      font-weight: 600;
      text-align: center;
    }

    .dashboard-panel p {
      font-size: 13px;
      color: #dfdfdf;
      margin: 0 0 12px 0;
      text-align: center;
    }

    .query-select, .query-btn, .task-select-dropdown {
      width: 100%;
      margin-bottom: 8px;
      padding: 6px;
      font-size: 14px;
      border-radius: 2px;
      border: 1px solid #ccc;
      box-sizing: border-box;
    }

    .task-select-dropdown {
      cursor: pointer;
      color: #323232;
      background: #fff;
      height: 34px;
    }

    .query-btn {
      background-color: #007ac2;
      color: white;
      font-weight: bold;
      cursor: pointer;
      border: none;
      transition: background-color 0.2s;
    }

    .query-btn:hover {
      background-color: #005e95;
    }

    #printResults {
      font-size: 13px;
      font-weight: bold;
      margin-top: 5px;
      display: block;
      text-align: center;
    }

    label {
      font-size: 13px;
      display: block;
      margin-bottom: 4px;
    }
  </style>

  <script>
    require([
      "esri/Map",
      "esri/views/MapView",
      "esri/layers/TileLayer",
      "esri/layers/FeatureLayer",
      "esri/layers/GraphicsLayer",
      "esri/rest/support/Query",
      "dojo/dom",
      "dojo/on",
      "dojo/domReady!"
    ], function(Map, MapView, TileLayer, FeatureLayer, GraphicsLayer, Query, dom, on) {

      var transportationLayer = new TileLayer({
        url: "https://arcgisonline.com"
      });

      var housingRenderer = {
        type: "simple",
        symbol: {
          type: "simple-marker",
          size: 6,
          color: "orange",
          style: "circle",
          outline: {
            width: 1,
            color: "white"
          }
        }
      };

      var boiseHousingLayer = new FeatureLayer({
        url: "https://arcgis.com",
        renderer: housingRenderer,
        outFields: ["*"],
        popupTemplate: {
          title: "County Info: {COUNTY}",
          content: "<b>Population (2017):</b> {POPULATION}<br><b>Square Miles:</b> {SQMI}"
        }
      });

      var highlightLayer = new GraphicsLayer();

      var map = new Map({
        basemap: "dark-gray-vector",
        layers: [transportationLayer, boiseHousingLayer, highlightLayer]
      });

      var view = new MapView({
        container: "viewDiv",
        map: map,
        center: [-116.2023, 43.6150],
        zoom: 7
      });

      view.when(function() {
        view.ui.add("navDiv", "top-right");
        view.ui.add("optionsDiv", "bottom-right");

        on(dom.byId("doQueryBtn"), "click", executeHousingQuery);
        on(dom.byId("taskDropdown"), "change", handleNavigationChange);
      });

      var selectAttribute = dom.byId("attSelect");
      var selectExpression = dom.byId("signSelect");
      var selectValue = dom.byId("valSelect");

      function executeHousingQuery() {
        highlightLayer.removeAll();

        var whereClause = selectAttribute.value + " " + selectExpression.value + " " + selectValue.value;

        var queryTaskParams = boiseHousingLayer.createQuery();
        queryTaskParams.where = whereClause;
        queryTaskParams.returnGeometry = true;
        queryTaskParams.outFields = ["*"];

        boiseHousingLayer.queryFeatures(queryTaskParams)
          .then(handleQueryResults)
          .catch(function(error) {
            console.error("Query Execution Exception Root Cause Pipeline Trace: ", error);
          });
      }

      function handleQueryResults(response) {
        var featuresFound = response.features;

        if (featuresFound.length === 0) {
          dom.byId("printResults").innerHTML = "0 records found matching settings.";
          return;
        }

        var uniqueHighlightStyle = {
          type: "simple-marker",
          size: 12,
          color: "cyan",
          outline: { width: 2, color: "white" }
        };

        featuresFound.forEach(function(feature) {
          feature.symbol = uniqueHighlightStyle;
          highlightLayer.add(feature);
        });

        view.goTo({
          target: featuresFound,
          zoom: 9
        }, {
          duration: 1500,
          easing: "ease-in-out"
        }).then(function() {
          view.popup.open({
            features: featuresFound,
            updateLocationEnabled: true
          });
        });

        dom.byId("printResults").innerHTML = featuresFound.length + " matching record(s) isolated!";
      }

      function handleNavigationChange() {
        var selectedUrl = this.value;
        if (selectedUrl) {
          window.open(selectedUrl, '_blank');
          this.value = "";
        }
      }
    });
  </script>
</head>
<body>

  <div id="viewDiv"></div>

  <div class="esri-widget dashboard-panel" id="navDiv">
    <h1>Lab 7 Tasks</h1>
    <p>Select an entry below to open the specific map task.</p>
    <select id="taskDropdown" class="task-select-dropdown">
      <option value="" selected disabled>-- Select a Map Task --</option>
      <option value="simple_mapping.html">Task 1</option>
      <option value="tile_layer.html">Task 2</option>
      <option value="dynamic_layers.html">Task 3</option>
      <option value="on_event.html">Task 4</option>
      <option value="basemap_gallery.html">Task 5</option>
      <option value="query_task.html">Task 6</option>
    </select>
  </div>

  <div class="esri-widget dashboard-panel" id="optionsDiv">
    <h2>Boise Housing Filtering</h2>

    <label for="attSelect">Select Field Parameter:</label>
    <select class="query-select" id="attSelect">
      <option value="POPULATION" selected>Population Metrics</option>
      <option value="SQMI">Square Mileage Space</option>
    </select>

    <label for="signSelect">Conditional Operator:</label>
    <select class="query-select" id="signSelect">
      <option value="&gt;">is greater than (&gt;)</option>
      <option value="&lt;">is less than (&lt;)</option>
    </select>

    <label for="valSelect">Evaluation Limit:</label>
    <select class="query-select" id="valSelect">
      <option value="1000">1,000</option>
      <option value="10000">10,000</option>
      <option value="25000">25,000</option>
      <option value="50000">50,000</option>
    </select>

    <button class="query-btn" id="doQueryBtn">Filter Map View</button>
    <span id="printResults"></span>
  </div>

</body>
</html>
