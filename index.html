  <link rel="stylesheet" type="text/css" href="css/map_style.css">

</head>
<body>
  <div id="body-container">
    <div id="header">
      <script src="javascript/external.js"></script>
      <script>
      document.write(welcome());
      </script>
    </div>
    <div id="profile-picture">
      <img src="images/profile-picture.jpg" width="250px" height="250px" alt="Christopher Quiroga Profile" />
    </div>
    <div id="welcome-text">
      <p>
        My name is Christopher Quiroga. <br>
        I am a student in the
        <a href="https://www.geo.txstate.edu/" target="_blank"> Geography Department</a> at
        <a href="https://txstate.edu/" target="_blank"> Texas State University</a>.
      </p>
    </div>
    <div id="research-interests">

      <ol>
        <li>GIS</li>

        <li>Urban Planning</li>
      </ol>
    </div>
    <div id="webmap-reviews">
      <h3>Webmap Reviews</h3>
      <script>
      document.write(webmap_table());
      </script>
      <h3>Geocoding Map</h3>
      <br>
      <div id="mapid" style="width: 600px; height: 400px; margin: auto; position: relative; bottom: 30px;"></div>
      <script>
        var mymap = L.map('mapid');
        mymap.setView([0,0], 1);
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
          maxZoom: 18,
        }).addTo(mymap);
        var geocoder = L.Control.geocoder({
          defaultMarkGeocode: false
        }).on('markgeocode', function(e) {
          var bbox = e.geocode.bbox;
          var poly = L.polygon([
               bbox.getSouthEast(),
               bbox.getNorthEast(),
               bbox.getNorthWest(),
               bbox.getSouthWest()
          ]);
          mymap.fitBounds(poly.getBounds());
        }).addTo(mymap);
      </script>
    </div>
  </div>
  <div id="copyright">
    <script>
      var today = new Date();
      var year = today.getFullYear();
      document.writeln("Copyright &copy; " + year);

  </div>
